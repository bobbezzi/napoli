<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Napoli · i consigli</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#16181d;--mute:#6b7280;--line:#e7e7ea;--red:#e02424}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.45 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column}
header{padding:12px 16px 10px;border-bottom:1px solid var(--line)}
h1{margin:0 0 8px;font-size:20px;font-weight:800;letter-spacing:-.01em}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--c,#999);background:#fff;color:var(--ink);border-radius:999px;padding:7px 12px;font:600 13px Inter,sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;min-height:36px}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip.on{background:var(--c);color:#fff}.chip.on i{background:#fff}
.chip.sun{--c:var(--red)}
main{flex:1;display:grid;grid-template-columns:360px 1fr;min-height:0}
#list{overflow-y:auto;border-right:1px solid var(--line)}
#map{height:100%;min-height:300px}
.cat h2{position:sticky;top:0;margin:0;padding:10px 16px;font-size:13px;font-weight:800;background:#f6f6f7;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.cat h2 i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.cat h2 span{margin-left:auto;color:var(--mute);font-weight:600}
.item{padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.item:hover{background:#fafafa}
.item b{display:block;font-weight:600}
.item small{display:block;color:var(--mute);font-size:13px}
.item .note{color:var(--ink);font-size:13px;margin-top:2px}
.closed{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:var(--red);border:1px solid var(--red);border-radius:4px;padding:0 4px;vertical-align:1px}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);position:relative}
.pin::after{content:"";position:absolute;inset:7px;border-radius:50%;background:#fff}
.top{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:#8a6200;background:#fff4c2;border:1px solid #e6b800;border-radius:4px;padding:0 4px;vertical-align:1px}
.pin.s .star{position:absolute;top:-9px;left:-9px;font-size:15px;line-height:1;transform:rotate(45deg);z-index:3;text-shadow:0 0 2px #fff}
.pin.x::before{content:"";position:absolute;top:-5px;right:-5px;width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid #fff;transform:rotate(45deg);z-index:2}
.leaflet-popup-content{font:14px/1.4 Inter,sans-serif;margin:12px 14px}
.pop b{font-size:15px}.pop .cat-l{font-size:12px;font-weight:700;color:var(--c)}
.pop a.nav{display:inline-block;margin-top:8px;background:#16181d;color:#fff;text-decoration:none;padding:7px 12px;border-radius:8px;font-weight:600}
.home{width:34px;height:34px;border-radius:9px;background:#16181d;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.45);display:grid;place-items:center}
.home svg{width:20px;height:20px;fill:#fff}
.homerow{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:#16181d;color:#fff}
.homerow b{font-weight:700}.homerow small{display:block;color:#c9cbd1;font-size:13px}
.homerow .hi{width:30px;height:30px;border-radius:8px;background:#fff;display:grid;place-items:center;flex:none}.homerow .hi svg{width:18px;height:18px;fill:#16181d}
.loc{background:#fff;border:2px solid rgba(0,0,0,.2);border-radius:6px;width:36px;height:36px;font-size:18px;cursor:pointer}
@media(max-width:760px){main{grid-template-columns:1fr;grid-template-rows:55vh auto}#map{order:-1}#list{border-right:0;overflow:visible}body{display:block}main{display:grid}}
</style>
</head>
<body>
<header>
  <div class="chips" id="chips"></div>
</header>
<main>
  <div id="list"></div>
  <div id="map"></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
{
const CATS = [{"name":"Logistica","color":"#5b6472","items":[{"n":"Parking Grangusto","a":"Vico degli Scoppettieri, 47/49, 80133 Napoli","la":40.843888,"lo":14.2579763,"x":false,"t":"Aperto 24h, si lasciano le chiavi. Chiedi la tariffa prima"},{"n":"Funicolare Centrale (Augusteo)","a":"Funicolare Centrale, Napoli","la":40.8411962,"lo":14.2388214,"x":false,"t":"Per salire al Vomero"},{"n":"Metro Toledo","a":"Stazione Toledo, 80134 Napoli","la":40.8424893,"lo":14.2488826,"x":false,"t":"La fermata pazzesca"}]},{"name":"Quando arriviamo","color":"#2b7fd6","items":[{"n":"Mimì alla Ferrovia","a":"Via Alfonso D'Aragona, 19/21, 80139 Napoli","la":40.8534539,"lo":14.267209,"x":true,"t":"Pranzo di venerdì. In due niente prenotazione, si fa la coda"},{"n":"Sfogliatelle Attanasio","a":"Vico Ferrovia, 1, 80142 Napoli","la":40.8532124,"lo":14.2689761,"x":false,"t":"Chiuso lunedì. A 2 minuti da Mimì"}]},{"name":"Street food e colazioni","color":"#ef7d16","items":[{"n":"Antica Pizzeria Di Matteo","a":"Via dei Tribunali, 94, 80138 Napoli","la":40.8512512,"lo":14.2579677,"x":true,"s":true,"t":"Frittatina: due fanno un pranzo"},{"n":"Pizzeria De' Figliole","a":"Via Giudecca Vecchia, 39, 80139 Napoli","la":40.8512246,"lo":14.2634146,"x":true,"t":"Pizza fritta tonda al piatto"},{"n":"La Masardona","a":"Via Giulio Cesare Capaccio, 27, 80142 Napoli","la":40.8485171,"lo":14.2735025,"x":true,"t":"Pizza fritta. Solo pranzo, sabato anche cena"},{"n":"Gino e Toto Sorbillo","a":"Via dei Tribunali, 32, 80138 Napoli","la":40.850425,"lo":14.2553581,"x":true,"t":"Pizza fritta da passeggio"},{"n":"Fiorenzano – Pignasecca","a":"Via Pignasecca, 48/50, 80134 Napoli","la":40.8459114,"lo":14.2480734,"x":true,"t":"Trippa e interiora"},{"n":"Chalet Ciro – Mergellina","a":"Via Caracciolo fronte Via Orazio, 80122 Napoli","la":40.8268509,"lo":14.220088,"x":false,"t":"La graffa"},{"n":"Luminist Caffè Bistrot","a":"Via Toledo, 177/178, 80134 Napoli","la":40.8406439,"lo":14.2487772,"x":false,"t":"Colazione stellata con i lievitati, vai presto (apre alle 8)"},{"n":"Bar Mary (Mary's Sfogliatella)","a":"Galleria Umberto I, 66, 80132 Napoli","la":40.8384399,"lo":14.248703,"x":false,"t":"Chiuso martedì. Colazione sotto la Galleria"},{"n":"PUOK Spaccanapoli","a":"Piazzetta Nilo, 9, 80134 Napoli","la":40.8486679,"lo":14.2557813,"x":false,"t":"Panini da asporto"},{"n":"Pasticceria Poppella","a":"Via Arena della Sanità, 28/29, 80137 Napoli","la":40.8574084,"lo":14.2535012,"x":false,"t":"Fiocco di neve"},{"n":"Passione di Sofì","a":"Via Toledo, 206, 80132 Napoli","la":40.8388483,"lo":14.2484831,"x":false,"t":"Friggitoria"},{"n":"Taralleria Napoletana","a":"Via San Biagio dei Librai, 3, 80138 Napoli","la":40.8488559,"lo":14.2563778,"x":false,"t":"Taralli pregiati"},{"n":"Tarallificio Leopoldo","a":"Via Foria, 212, 80139 Napoli","la":40.8598676,"lo":14.2628593,"x":false,"t":"Taralli pregiati"},{"n":"Friggitoria Vomero","a":"Via Domenico Cimarosa, 44, 80129 Napoli","la":40.842807,"lo":14.232839,"x":true,"t":"Vicino a Castel Sant'Elmo. Pausa 14:30-18:00"}]},{"name":"Pizzerie","color":"#d4a000","items":[{"n":"Da Attilio alla Pignasecca","a":"Via Pignasecca, 17, 80134 Napoli","la":40.8452337,"lo":14.2483503,"x":true,"t":"Pignasecca, fai la fila"},{"n":"Pizzeria Pellone","a":"Via Nazionale, 93, 80143 Napoli","la":40.8561618,"lo":14.2741284,"x":true,"t":"Vicino alla stazione, niente prenotazioni"},{"n":"Carmnella","a":"Via Cristoforo Marino, 22, 80142 Napoli","la":40.8493527,"lo":14.2785476,"x":true,"t":"Lascia il nome prima dell'apertura serale"},{"n":"50 Kalò","a":"Piazza Sannazaro, 201/c, 80121 Napoli","la":40.8283718,"lo":14.2202575,"x":false,"t":"Mergellina, lista d'attesa lunga"},{"n":"Diego Vitagliano – Santa Lucia","a":"Via Santa Lucia, 78, 80132 Napoli","la":40.832383,"lo":14.248694,"x":false,"t":"Traversa del lungomare, tutti i giorni 12-15:15 e 19-24"},{"n":"Diego Vitagliano – Bagnoli","a":"Via Nuova Agnano, 1, 80125 Napoli","la":40.8170977,"lo":14.1756869,"x":false,"t":"Fuori centro, meglio in auto"},{"n":"Starita a Materdei","a":"Via Materdei, 27/28, 80136 Napoli","la":40.8559311,"lo":14.2464158,"x":false,"t":"Chiuso lunedì. Niente prenotazioni"},{"n":"Concettina ai Tre Santi","a":"Via Arena della Sanità, 7 bis, 80137 Napoli","la":40.8574657,"lo":14.2521604,"x":false,"t":"Rione Sanità"},{"n":"Lombardi a Santa Chiara","a":"Via Benedetto Croce, 59, 80134 Napoli","la":40.8476443,"lo":14.2532907,"x":false,"t":"Centro storico"},{"n":"Lombardi 1892 – Via Foria","a":"Via Foria, 12/14, 80137 Napoli","la":40.8553845,"lo":14.256377,"x":false,"t":"Chiuso lunedì. Sede storica"}]},{"name":"Trattorie, notte e gelato","color":"#2f9e5b","items":[{"n":"Zito 41","a":"Via San Giacomo, 41, 80133 Napoli","la":40.840862,"lo":14.2495951,"x":false,"t":"Trattoria"},{"n":"La Locanda Gesù Vecchio","a":"Via Giovanni Paladino, 26, 80138 Napoli","la":40.8472376,"lo":14.2571481,"x":false,"t":"Chiuso lunedì. Meglio prenotare"},{"n":"Cibi Cotti «Nonna Anna»","a":"Via Ferdinando Galiani, 30, 80122 Napoli","la":40.831006,"lo":14.2234,"x":true,"t":"Cucina di casa nel mercato della Torretta. Solo pranzo, lun-sab"},{"n":"Il Ciottolo","a":"Via Amerigo Vespucci, 90, 80142 Napoli","la":40.8468397,"lo":14.2741166,"x":false,"t":"Fame notturna: aperto 18:30-6:30"},{"n":"Mennella – Via Toledo","a":"Via Toledo, 110, 80134 Napoli","la":40.8436118,"lo":14.2491137,"x":false,"t":"Gelato, aperto fino a tardi"},{"n":"Mennella – Corso Umberto","a":"Corso Umberto I, 371, 80142 Napoli","la":40.8508633,"lo":14.2668981,"x":false,"t":"Gelato"},{"n":"Fantasia Gelati – Vomero","a":"Via Francesco Cilea, 80, 80127 Napoli","la":40.8432794,"lo":14.2231647,"x":false,"t":"Gelato al Vomero"}]},{"name":"Cose da vedere","color":"#8a4fd0","items":[{"n":"Castel Sant'Elmo","a":"Via Tito Angelini, 20/A, 80129 Napoli","la":40.8444515,"lo":14.2388951,"x":false,"t":"Chiude alle 18:30, martedì chiuso. Biglietto a pagamento"},{"n":"Napoli Sotterranea","a":"Piazza San Gaetano, 68, 80138 Napoli","la":40.8511296,"lo":14.2568408,"x":false,"t":"Ingresso su via dei Tribunali. Prenota il turno"},{"n":"Via dei Tribunali","a":"Via dei Tribunali, Napoli","la":40.8515175,"lo":14.2588326,"x":false,"t":"La via più autentica"},{"n":"Via San Gregorio Armeno","a":"Via San Gregorio Armeno, 80138 Napoli","la":40.8499155,"lo":14.2579103,"x":false,"t":"La via dei presepi"},{"n":"Cappella Sansevero (Cristo Velato)","a":"Via Francesco de Sanctis, 19/21, 80134 Napoli","la":40.8492951,"lo":14.2548837,"x":false,"t":"Chiuso martedì. Biglietto online"},{"n":"Rione Sanità","a":"Rione Sanità, Napoli","la":40.8598479,"lo":14.2541292,"x":false,"t":"Quartiere da girare a piedi"},{"n":"Palazzo dello Spagnolo","a":"Via Vergini, 19, 80137 Napoli","la":40.8567658,"lo":14.2543135,"x":false,"t":"Scala barocca, visibile dal cortile"},{"n":"Jago Museum","a":"Piazzetta Crociferi, 4, 80137 Napoli","la":40.8562966,"lo":14.2559654,"x":false,"t":"Ven-dom anche 15-19"},{"n":"Cimitero delle Fontanelle","a":"Via Fontanelle, 80, 80136 Napoli","la":40.8584,"lo":14.2435,"x":false,"t":"Ossario nel tufo, esperienza particolare. Verifica orari prima"},{"n":"Gran Caffè Gambrinus","a":"Via Chiaia, 1, 80132 Napoli","la":40.8367945,"lo":14.248479,"x":false,"t":"Caffettino in piazza del Plebiscito (c'è ressa)"}]},{"name":"Al ritorno (Caserta)","color":"#d6418f","items":[{"n":"Caseificio Leuci","a":"Via Nazionale Appia, 150, 81022 Casagiove CE","la":41.073225,"lo":14.3086371,"x":false,"t":"Mozzarelle. Domenica solo fino alle 13:30"}]}];
const HOME = {n:'Casa nostra',a:'Via Filippo Rega, 29, 80132 Napoli',la:40.8387547,lo:14.2404158};
const HOUSE = '<svg viewBox="0 0 24 24"><path d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z"/></svg>';
const map = L.map('map',{zoomControl:true}).setView([40.846,14.252],14);
const base = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{
  maxZoom:19,
  attribution:'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors'
}).addTo(map);

const active = new Set(CATS.map((_,i)=>i));
let onlySun = false;
const markers = [];
const homeMarker = L.marker([HOME.la,HOME.lo],{zIndexOffset:1000,title:HOME.n,
  icon:L.divIcon({className:'',html:`<div class="home">${HOUSE}</div>`,iconSize:[34,34],iconAnchor:[17,17],popupAnchor:[0,-16]})
}).addTo(map).bindPopup(`<div class="pop"><b>🏠 ${HOME.n}</b><br><small>${HOME.a}</small><br><a class="nav" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(HOME.a)}" target="_blank" rel="noopener">Torna a casa ↗</a></div>`);
const navUrl = p => 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(p.n+', '+p.a);

CATS.forEach((c,ci)=>c.items.forEach((p,pi)=>{
  const icon = L.divIcon({className:'',html:`<div class="pin${p.x?' x':''}${p.s?' s':''}" style="--c:${c.color}">${p.s?'<span class="star">⭐</span>':''}</div>`,iconSize:[26,26],iconAnchor:[13,26],popupAnchor:[0,-24]});
  const m = L.marker([p.la,p.lo],{icon,title:p.n}).bindPopup(
    `<div class="pop" style="--c:${c.color}"><div class="cat-l">${c.name}</div><b>${p.s?'⭐ ':''}${p.n}</b>${p.s?'<span class="top">da provare</span>':''}${p.x?'<span class="closed">🔴 chiuso domenica</span>':''}<br><small>${p.a}</small><div>${p.t}</div><a class="nav" href="${navUrl(p)}" target="_blank" rel="noopener">Naviga ↗</a></div>`);
  markers.push({m,ci,p});
}));

function render(){
  document.getElementById('chips').innerHTML =
    `<button class="chip ${active.size===CATS.length?'on':''}" style="--c:#16181d" data-all>Tutte</button>` +
    CATS.map((c,i)=>`<button class="chip ${active.has(i)?'on':''}" style="--c:${c.color}" data-i="${i}"><i></i>${c.name}</button>`).join('') +
    `<button class="chip sun ${onlySun?'on':''}" data-sun><i></i>Solo aperti domenica</button>`;
  markers.forEach(o=>{
    const show = active.has(o.ci) && !(onlySun && o.p.x);
    show ? o.m.addTo(map) : o.m.remove();
  });
  document.getElementById('list').innerHTML = `<div class="homerow" data-home><span class="hi">${HOUSE}</span><div><b>Casa nostra</b><small>${HOME.a}</small></div></div>` + CATS.map((c,ci)=>{
    if(!active.has(ci)) return '';
    const items = markers.filter(o=>o.ci===ci && !(onlySun && o.p.x));
    return `<section class="cat" style="--c:${c.color}"><h2><i></i>${c.name}<span>${items.length}</span></h2>` +
      items.map(o=>`<div class="item" data-k="${markers.indexOf(o)}"><b>${o.p.s?'⭐ ':''}${o.p.x?'🔴 ':''}${o.p.n}${o.p.s?'<span class="top">da provare</span>':''}${o.p.x?'<span class="closed">chiuso domenica</span>':''}</b><small>${o.p.a}</small><div class="note">${o.p.t}</div></div>`).join('') +
      `</section>`;
  }).join('');
}

document.getElementById('chips').addEventListener('click',e=>{
  const b = e.target.closest('button'); if(!b) return;
  if('all' in b.dataset){ if(active.size===CATS.length) active.clear(); else CATS.forEach((_,i)=>active.add(i)); }
  else if('sun' in b.dataset){ onlySun=!onlySun; }
  else { const i=+b.dataset.i; active.has(i)?active.delete(i):active.add(i); }
  render();
});
document.getElementById('list').addEventListener('click',e=>{
  if(e.target.closest('[data-home]')){ map.flyTo(homeMarker.getLatLng(),17,{duration:.6}); setTimeout(()=>homeMarker.openPopup(),650);
    if(window.innerWidth<=760) document.getElementById('map').scrollIntoView({behavior:'smooth'}); return; }
  const it = e.target.closest('.item'); if(!it) return;
  const o = markers[+it.dataset.k];
  map.flyTo(o.m.getLatLng(),17,{duration:.6});
  setTimeout(()=>o.m.openPopup(),650);
  if(window.innerWidth<=760) document.getElementById('map').scrollIntoView({behavior:'smooth'});
});

// pulsante "dove sono"
const Loc = L.Control.extend({onAdd(){const b=L.DomUtil.create('button','loc');b.title='Dove sono';b.textContent='◎';
  L.DomEvent.on(b,'click',ev=>{L.DomEvent.stop(ev);map.locate({setView:true,maxZoom:16});});return b;}});
new Loc({position:'topleft'}).addTo(map);
const Home = L.Control.extend({onAdd(){const b=L.DomUtil.create('button','loc');b.title='Casa';b.innerHTML='🏠';
  L.DomEvent.on(b,'click',ev=>{L.DomEvent.stop(ev);map.flyTo(homeMarker.getLatLng(),16,{duration:.6});homeMarker.openPopup();});return b;}});
new Home({position:'topleft'}).addTo(map);
let me;
map.on('locationfound',e=>{ if(me) me.remove(); me=L.circleMarker(e.latlng,{radius:8,color:'#fff',weight:3,fillColor:'#1a73e8',fillOpacity:1}).addTo(map); });

render();
}
</script>
</body>
</html>
